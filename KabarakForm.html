<!DOCTYPE html>
<html>
<head><title>Applicant'sDetails</title></head>

<body>
<h1>Applicant'sDetails</h1>
<form><h2>Applicant'sDetails</h2>
<label for="fullname">Fullname:</label><br>
<input type="text" id="fullname" name="fullname"<br>

<label for="title">Title:</label><br>
<select id="title"><option value="mr"Mr.</option><option value="ms"Ms.</option></select><br>

<label for="gender">Gender;</label><br>
<input type="radio" id="male" name="gender" value="male"><label for="male">Male</label><br>
<input type="radio" id="female" name="gender" value="female"<label for="female"Female</label><br>

<label for="maritalstatus">MaritalStatus:</label><br>
<input type="text" id="maritalstatus" name="maritalstatus"<br><br>

<h2>Parent's/Guardian's Contacts</h2>
<label for="fathername">Father's Name:</label>
<input type="text" id="fathername" name="fathername"><br>
<label for="fathermobile">Father's MobileNo.:</label><br>
<input type="tel" id="fathermobile" name="fathermobile"><br>
<label for="fatheroccupation">Father's occupation:</label><br>
<input type="text" id="fatheroccupation" name="fatheroccupation"><br>

<label for="mothername"Mother's Name:</label><br>
<input type="text" id="mothername" name="mothername"><br>
<label for="mothermobile">Mother's MobileNo.:</label><br>
<input type="tel" id="mothermobile" name="mothermobile"><br>
<label for="motheroccupation">Mother's Occcupation:</label><br>
<input type="text" id="motheroccupation" name="motheroccupation"><br>

<label for="institution">Institution Attended:</label><br>
<input type="text" id="insitution" name="institution"><br>
<label for="fromyear">From(Year):</label><br>
<input type="number" id="fromyear" name="fromyear"<br>
<label for="certificate">Certificate Awarded:</label><br>
<input type="text" id="certificate" name="certificate"><br><br>

<h2>Educational Plans</h2>
<label for="program">Program Applied For:</label><br>
<input type="checkbox" id="doctorate" name="program" value="doctorate"><label for="doctorate">Doctorate</label><br>
<input type="checkbox" id="masters" name="program" value="masters"><label for="masters">Maters</label><br>
<input type="checkbox" id="degree" name="program" value="degree"><label for="degree">Degree</label><br><br>

<h2>Campus Preference</h2>
<label for="campus">Campus:</label><br>
<input type="radio" id="maincampus" name="campus" value="main"><label for="maincampus">Main Campus</label><br>
<input type="radio" id="towncampus" name="campus" value="town"><label for="towncampus">Town Campus</label><br>

<input type="submit" value="submit">
</form>
</body>
</html>
